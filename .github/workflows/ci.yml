# Prüfung jedes Pull Requests auf main und jedes Pushs auf main.
name: CI

on:
  pull_request:
    branches: [main]
    # edited: eine Korrektur am PR-Text startet die Prüfung neu
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Code holen (ganze Historie für cleanup.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kopf des PR statt des von GitHub erzeugten Merge-Commits prüfen
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js aus .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Typprüfung
        run: npx tsc --noEmit

      - name: Unit-Tests
        run: node --test tests/unit/

      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium webkit

      - name: E2E-Tests (Chromium und WebKit)
        run: npx playwright test

      - name: cleanup.sh
        run: bash scripts/cleanup.sh

      - name: PR-Titel und -Text ohne Sitzungs-Links
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
        run: |
          # aktuellen Stand lesen, nicht den Stand zum Zeitpunkt des Ereignisses
          gh pr view "$PR_NUMMER" --json title,body --jq '.title, .body' > "$RUNNER_TEMP/pr.txt"
          if grep -inE 'claude\.ai/code/sessio[n]_|Claude-Sessio[n]:|Co-Authored-B[y]:' "$RUNNER_TEMP/pr.txt"; then
            echo "::error::PR-Titel oder -Text enthält einen Sitzungs-Link oder eine Mitautor-Zeile."
            exit 1
          fi
